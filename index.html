<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spin & Win</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        .container {
            text-align: center;
            padding: 20px;
        }
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wheel-wrapper {
            position: relative;
            display: inline-block;
        }
        canvas {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            filter: drop-shadow(0 0 6px gold);
        }
        .btn {
            background: linear-gradient(45deg, #f6d365, #fda085);
            border: none;
            padding: 16px 50px;
            font-size: 22px;
            font-weight: bold;
            color: #0f0f1a;
            border-radius: 50px;
            margin-top: 30px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(253, 160, 133, 0.5);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; transform: none; }
        .result {
            font-size: 24px;
            margin-top: 25px;
            font-weight: bold;
            min-height: 40px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎰 Spin & Win</h2>
        <div class="wheel-wrapper">
            <div class="pointer">⬇️</div>
            <canvas id="wheel" width="320" height="320"></canvas>
        </div>
        <button id="spinBtn" class="btn">SPIN NOW!</button>
        <div id="resultDiv" class="result hidden"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ----- Parse token from URL -----
        const urlParams = new URLSearchParams(window.location.search);
        const spinToken = urlParams.get('token');
        if (!spinToken) {
            document.body.innerHTML = '<h2 style="color:red;">❌ Invalid session</h2>';
            setTimeout(() => tg.close(), 1500);
        }

        // ----- Wheel segments (8 segments, indices 0-7) -----
        const segments = [
            { label: '₹0',   value: 0,  color: '#e74c3c' },
            { label: '₹0.5', value: 1,  color: '#f39c12' },
            { label: '₹1',   value: 2,  color: '#2ecc71' },
            { label: '₹2',   value: 4,  color: '#3498db' },
            { label: '₹5',   value: 10, color: '#9b59b6' },
            { label: '₹10',  value: 20, color: '#e67e22' },
            { label: '₹0',   value: 0,  color: '#95a5a6' },
            { label: '₹0.5', value: 1,  color: '#f1c40f' }
        ];

        // ----- Extract target index from token (last part) -----
        const parts = spinToken.split('_');
        let targetIdx = parseInt(parts[parts.length - 1]);
        if (isNaN(targetIdx) || targetIdx < 0 || targetIdx >= segments.length) {
            targetIdx = 0;  // fallback
        }

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('resultDiv');
        let spinning = false;
        let currentRotation = 0;

        // ----- Draw wheel -----
        function drawWheel() {
            const cx = canvas.width / 2;
            const cy = canvas.height / 2;
            const radius = 140;
            const arc = (2 * Math.PI) / segments.length;

            for (let i = 0; i < segments.length; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, angle, angle + arc);
                ctx.fillStyle = segments[i].color;
                ctx.fill();
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Segment label
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 15px 'Segoe UI'";
                ctx.fillText(segments[i].label, radius - 18, 6);
                ctx.restore();
            }

            // Center circle
            ctx.beginPath();
            ctx.arc(cx, cy, 28, 0, 2 * Math.PI);
            ctx.fillStyle = '#0f0f1a';
            ctx.fill();
            ctx.strokeStyle = '#f6d365';
            ctx.lineWidth = 4;
            ctx.stroke();
            ctx.font = "bold 18px 'Segoe UI'";
            ctx.fillStyle = '#f6d365';
            ctx.textAlign = "center";
            ctx.fillText('🎰', cx, cy + 7);
        }

        drawWheel();

        // ----- Spin to target segment -----
        function spinTo(index) {
            if (spinning) return;
            spinning = true;
            spinBtn.disabled = true;
            resultDiv.classList.add('hidden');

            const segmentAngle = 360 / segments.length;
            // Aim for center of target segment with slight randomness
            const targetAngle = index * segmentAngle + segmentAngle / 2 + (Math.random() * 0.6 - 0.3) * segmentAngle;
            // Spin multiple full rotations + land
            const fullSpins = 360 * (5 + Math.floor(Math.random() * 3)); // 5-7 full rotations
            const finalRotation = currentRotation + fullSpins + (360 - targetAngle);

            canvas.style.transform = `rotate(${finalRotation}deg)`;
            currentRotation = finalRotation;

            // After animation ends
            setTimeout(() => {
                canvas.style.transition = 'none';
                spinning = false;
                spinBtn.disabled = false;

                const reward = segments[index];
                resultDiv.innerHTML = `🎉 You won ${reward.label}!`;
                resultDiv.classList.remove('hidden');

                // Send result back to Telegram bot
                tg.sendData(JSON.stringify({
                    token: spinToken,
                    coins: reward.value   // not used by bot, but nice to send
                }));

                // Close WebApp after 2 seconds
                setTimeout(() => tg.close(), 2000);
            }, 4000); // matches CSS transition duration
        }

        // ----- Button click -----
        spinBtn.addEventListener('click', () => spinTo(targetIdx));

        // Also allow MainButton
        tg.MainButton.setText('SPIN').show().onClick(() => spinTo(targetIdx));
    </script>
</body>
</html>
