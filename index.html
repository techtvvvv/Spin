<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spin & Win</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f0f1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }
        .container { text-align: center; padding: 20px; }
        h2 {
            font-size: 28px;
            margin-bottom: 20px;
            background: linear-gradient(45deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .wheel-wrapper { position: relative; display: inline-block; }
        canvas {
            max-width: 100%;
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(255, 215, 0, 0.6);
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .pointer {
            position: absolute; top: -15px; left: 50%;
            transform: translateX(-50%); font-size: 30px;
            filter: drop-shadow(0 0 6px gold);
        }
        .btn {
            background: linear-gradient(45deg, #f6d365, #fda085);
            border: none; padding: 16px 50px; font-size: 22px;
            font-weight: bold; color: #0f0f1a; border-radius: 50px;
            margin-top: 30px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(253, 160, 133, 0.5);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.5; transform: none; }
        .result { font-size: 24px; margin-top: 25px; font-weight: bold; min-height: 40px; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎰 Spin & Win</h2>
        <div class="wheel-wrapper">
            <div class="pointer">⬇️</div>
            <canvas id="wheel" width="320" height="320"></canvas>
        </div>
        <button id="spinBtn" class="btn">SPIN NOW!</button>
        <div id="resultDiv" class="result hidden"></div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const spinToken = urlParams.get('token');
        const rewardLabel = urlParams.get('label') || '₹0';   // e.g., "₹2"

        if (!spinToken) {
            document.body.innerHTML = '<h2 style="color:red;">❌ Invalid session</h2>';
            setTimeout(() => tg.close(), 1500);
        }

        const segments = [
            { label: '₹0',   color: '#e74c3c' },
            { label: '₹0.5', color: '#f39c12' },
            { label: '₹1',   color: '#2ecc71' },
            { label: '₹2',   color: '#3498db' },
            { label: '₹5',   color: '#9b59b6' },
            { label: '₹10',  color: '#e67e22' },
            { label: '₹0',   color: '#95a5a6' },
            { label: '₹0.5', color: '#f1c40f' }
        ];

        // token me last part index hai (optional, sirf visual ke liye)
        const parts = spinToken.split('_');
        let targetIdx = parseInt(parts[parts.length - 1]);
        if (isNaN(targetIdx) || targetIdx < 0 || targetIdx >= segments.length) targetIdx = 0;

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const resultDiv = document.getElementById('resultDiv');
        let spinning = false, currentRotation = 0;

        function drawWheel() {
            const cx = canvas.width/2, cy = canvas.height/2, radius = 140;
            const arc = (2 * Math.PI) / segments.length;
            for (let i = 0; i < segments.length; i++) {
                const angle = i * arc;
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, radius, angle, angle + arc);
                ctx.fillStyle = segments[i].color;
                ctx.fill();
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle + arc/2);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 15px "Segoe UI"'; ctx.textAlign = 'right';
                ctx.fillText(segments[i].label, radius - 18, 6);
                ctx.restore();
            }
            ctx.beginPath(); ctx.arc(cx, cy, 28, 0, 2*Math.PI);
            ctx.fillStyle = '#0f0f1a'; ctx.fill();
            ctx.strokeStyle = '#f6d365'; ctx.lineWidth = 4; ctx.stroke();
            ctx.font = 'bold 18px "Segoe UI"'; ctx.fillStyle = '#f6d365'; ctx.textAlign = 'center';
            ctx.fillText('🎰', cx, cy+7);
        }
        drawWheel();

        function spinTo(idx) {
            if (spinning) return;
            spinning = true; spinBtn.disabled = true; resultDiv.classList.add('hidden');
            const segAngle = 360 / segments.length;
            const targetAngle = idx * segAngle + segAngle/2 + (Math.random()*0.6-0.3)*segAngle;
            const fullSpins = 360 * (5 + Math.floor(Math.random()*3));
            const finalRotation = currentRotation + fullSpins + (360 - targetAngle);
            canvas.style.transform = `rotate(${finalRotation}deg)`;
            currentRotation = finalRotation;
            setTimeout(() => {
                canvas.style.transition = 'none';
                spinning = false; spinBtn.disabled = false;
                resultDiv.innerHTML = `🎉 You won ${rewardLabel}!`;
                resultDiv.classList.remove('hidden');
                // 💡 Ab token ke saath reward bhi bhej rahe hain
                tg.sendData(JSON.stringify({
                    token: spinToken,
                    reward: rewardLabel
                }));
                setTimeout(() => tg.close(), 2500);
            }, 4000);
        }

        spinBtn.addEventListener('click', () => spinTo(targetIdx));
        tg.MainButton.setText('SPIN').show().onClick(() => spinTo(targetIdx));
    </script>
</body>
</html>
