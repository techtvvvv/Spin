<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Spin</title>

<style>
body {
    margin: 0;
    background: #0a0a0a;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 20px;
    color: gold;
}

.wheel-container {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 40px auto;
}

#wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 10px solid gold;
    box-shadow: 0 0 40px gold, inset 0 0 30px #000;
    transition: transform 5s cubic-bezier(0.33, 1, 0.68, 1);
}

.pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 30px;
    color: red;
}

button {
    padding: 14px 40px;
    font-size: 20px;
    border-radius: 50px;
    border: none;
    background: linear-gradient(45deg, gold, orange);
    color: black;
    box-shadow: 0 0 20px gold;
}

#result {
    margin-top: 20px;
    font-size: 24px;
    color: lime;
}
</style>
</head>

<body>

<h1>🎰 SPIN & WIN</h1>

<div class="wheel-container">
    <div class="pointer">🔻</div>
    <canvas id="wheel" width="300" height="300"></canvas>
</div>

<button onclick="spin()">SPIN NOW</button>

<div id="result"></div>

<audio id="tick" src="https://www.soundjay.com/button/sounds/button-16.mp3"></audio>
<audio id="win" src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3"></audio>

<script>
const rewards = ["0", "0.5", "1", "2", "5", "10"];
const colors = ["#ff0055", "#ffaa00", "#00ffaa", "#00aaff", "#aa00ff", "#ff00aa"];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

let spinning = false;
let angle = 0;

function drawWheel() {
    let slice = 2 * Math.PI / rewards.length;

    for (let i = 0; i < rewards.length; i++) {
        ctx.beginPath();
        ctx.fillStyle = colors[i];
        ctx.moveTo(150,150);
        ctx.arc(150,150,150,i*slice,(i+1)*slice);
        ctx.fill();

        ctx.save();
        ctx.translate(150,150);
        ctx.rotate(i*slice + slice/2);
        ctx.fillStyle = "#000";
        ctx.font = "bold 16px Arial";
        ctx.fillText("₹"+rewards[i], 80, 5);
        ctx.restore();
    }
}

drawWheel();

function spin() {
    if (spinning) return;
    spinning = true;

    let resultDiv = document.getElementById("result");
    resultDiv.innerText = "Spinning...";

    let rand = Math.floor(Math.random() * rewards.length);
    let sliceDeg = 360 / rewards.length;

    let finalAngle = (360 * 8) + (rand * sliceDeg);

    let start = angle;
    let end = start + finalAngle;

    let duration = 5000;
    let startTime = null;

    function animate(time) {
        if (!startTime) startTime = time;
        let progress = time - startTime;

        let ease = 1 - Math.pow(1 - progress / duration, 3);
        angle = start + (end - start) * ease;

        canvas.style.transform = `rotate(${angle}deg)`;

        document.getElementById("tick").play();

        if (progress < duration) {
            requestAnimationFrame(animate);
        } else {
            let reward = rewards[rand];
            resultDiv.innerText = "🎉 You Won ₹" + reward;

            document.getElementById("win").play();
            confetti();

            // Telegram send
            if (window.Telegram.WebApp) {
                Telegram.WebApp.sendData(JSON.stringify({ reward }));
            }

            spinning = false;
        }
    }

    requestAnimationFrame(animate);
}

// 🎊 Confetti
function confetti() {
    for (let i = 0; i < 100; i++) {
        let div = document.createElement("div");
        div.style.position = "fixed";
        div.style.width = "6px";
        div.style.height = "6px";
        div.style.background = "hsl(" + Math.random()*360 + ",100%,50%)";
        div.style.top = "0";
        div.style.left = Math.random()*100 + "%";
        document.body.appendChild(div);

        let fall = setInterval(() => {
            div.style.top = parseInt(div.style.top) + 6 + "px";
            if (parseInt(div.style.top) > window.innerHeight) {
                clearInterval(fall);
                div.remove();
            }
        }, 20);
    }
}
</script>

</body>
</html>
